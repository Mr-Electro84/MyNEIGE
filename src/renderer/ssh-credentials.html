<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; form-action 'none'; frame-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyNEIGE · Connexion au serveur pédagogique</title>
  <link rel="stylesheet" href="ssh.css">
  <script src="ssh-credentials.js" defer></script>
</head>
<body class="credentials-window">
  <p class="brand">CERI · Serveur pédagogique</p><h1>Connexion SSH</h1>
  <p>Utilisez les mêmes identifiants que pour le VPN et CAS.</p>
  <form id="credentials" autocomplete="off">
    <label for="username">Identifiant universitaire</label>
    <input id="username" name="username" type="text" required maxlength="4096" autocomplete="off" spellcheck="false" autofocus>
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" required maxlength="4096" autocomplete="off">
    <p class="note">Cette saisie n’enregistre pas vos identifiants. Le serveur est sélectionné automatiquement.</p>
    <div class="actions"><button id="cancel" type="button">Annuler</button><button id="submit" type="submit">Se connecter</button></div>
    <p id="message" role="status" aria-live="polite"></p>
  </form>
</body>
</html>
